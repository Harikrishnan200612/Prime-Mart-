name: Deploy Prime Mart Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        env:
          # Set this variable in your GitHub repo:
          # Settings → Secrets and variables → Actions → Variables → New repository variable
          # Name: VITE_API_URL   Value: https://<your-backend>.onrender.com
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Ensure .nojekyll exists in dist
        run: touch client/dist/.nojekyll

      - name: Verify build artifacts
        run: |
          echo "=== Build output files ==="
          find client/dist -maxdepth 3 -type f -print
          echo ""
          echo "=== index.html contents ==="
          cat client/dist/index.html
          echo ""
          echo "=== Checking required files ==="
          test -f client/dist/index.html && echo "✓ index.html present"
          test -d client/dist/assets && echo "✓ assets/ directory present"
          test -f client/dist/.nojekyll && echo "✓ .nojekyll present"
          grep -q '<div id="root">' client/dist/index.html && echo "✓ React root div found"
          grep -q '/Prime-Mart-/assets/' client/dist/index.html && echo "✓ base path /Prime-Mart-/ is set correctly"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4