services:
  - type: web
    name: prime-mart
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URLS
        value: https://harikrishnan200612.github.io,http://localhost:5173
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
